{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>
        Login
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="primary-button">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
