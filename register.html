{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>
        Register
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="primary-button">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

{% endblock %}
