{% extends 'base.html' %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="form-card">
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="primary-button">
            {% if title == 'Create Post' %}Create Post{% else %}Save Changes{% endif %}
        </button>

        <a href="{% url 'home' %}" class="cancel-button">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
